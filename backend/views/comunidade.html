<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enchant - Comunidade</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Passion+One:wght@400;700&family=Lexend+Deca:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="shortcut icon" href="https://i.ibb.co/7NybZ3W7/1.png" type="image/x-icon">

    <link rel="stylesheet" href="/styles/enchant/comunidade.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/scripts/supabaseClient.js" type="module"></script>

    <script>
        function verificarStatusLogin() {
            try {
                const authKey = Object.keys(localStorage).find(key => 
                    key.startsWith('sb-') && key.endsWith('-auth-token')
                );
                
                if (!authKey) {
                    console.log('❌ Nenhuma chave de autenticação encontrada');
                    return false;
                }
                
                const authData = JSON.parse(localStorage.getItem(authKey));
                const isLoggedIn = !!(authData && authData.access_token);
                
                console.log('🔐 Status de login:', isLoggedIn);
                return isLoggedIn;
            } catch (e) {
                console.error('Erro ao verificar login:', e);
                return false;
            }
        }

        function carregarScript(src, options = {}) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                
                if (options.type) script.type = options.type;
                if (options.defer) script.defer = true;
                
                script.onload = () => {
                    console.log(`✅ Script carregado: ${src}`);
                    resolve();
                };
                
                script.onerror = () => {
                    console.error(`❌ Erro ao carregar: ${src}`);
                    reject(new Error(`Falha ao carregar ${src}`));
                };
                
                document.head.appendChild(script);
            });
        }

        document.addEventListener('DOMContentLoaded', async () => {
            console.log('🚀 Página carregada, inicializando...');

            const estaLogado = verificarStatusLogin();

            try {
                if (estaLogado) {
                    console.log('✅ Usuário LOGADO - Carregando interface completa...');
                    
                    const postCreatorContainer = document.getElementById('post-creator-container');
                    if (postCreatorContainer) {
                        postCreatorContainer.style.display = 'block';
                    }
                    
                    await carregarScript('/scripts/layouts/comprador/sidebar.js', { type: 'module', defer: true });
                    await carregarScript('/scripts/layouts/comprador/headercomprador.js', { type: 'module', defer: true });
                    
                    carregarScript('/scripts/assistente.js', { defer: true });
                    
                } else {
                    console.log('👤 Visitante NÃO LOGADO - Carregando interface básica...');
                    
                    const postCreatorContainer = document.getElementById('post-creator-container');
                    if (postCreatorContainer) {
                        postCreatorContainer.style.display = 'none';
                    }
                    
                    await carregarScript('/scripts/layouts/enchant/headerenchant.js');
                    await carregarScript('/scripts/layouts/enchant/footerenchant.js');
                }

                await new Promise(resolve => setTimeout(resolve, 100));

                if (typeof initializeHeader === 'function') {
                    console.log('🎨 Inicializando header...');
                    initializeHeader('header-container');
                }

                console.log('📄 Carregando lógica da comunidade...');
                await carregarScript('/scripts/enchant/comunidade.js', { type: 'module' });

                console.log('✅ Inicialização completa!');

            } catch (error) {
                console.error('❌ Erro durante a inicialização:', error);
            }
        });
    </script>
    
    <script src="/scripts/layouts/enchant/loader.js" type="module" defer></script>
</head>

<body class="auto-loader">
    <section>
        <div id="header-container"></div>
    </section>

    <main class="comunidade-main">
        <div class="container">
            <header class="comunidade-header">
                <div class="header-content">
                    <i class="fas fa-users-line"></i>
                    <div>
                        <h1>Comunidade</h1>
                        <p>Conecte-se com ONGs e acompanhe suas histórias</p>
                    </div>
                </div>
            </header>

            <div id="post-creator-container" style="display: none;">
                <div class="create-post-box">
                    <button id="btn-nova-postagem" class="btn-nova-postagem">
                        <i class="fas fa-pen"></i>
                        <span>O que há de novo?</span>
                    </button>
                </div>
            </div>

            <div id="feed-container" class="feed-container">
                <div class="loading-spinner">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Carregando publicações...</p>
                </div>
            </div>
        </div>
    </main>

    <div id="modal-postagem" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <header class="modal-header">
                <h2 id="modal-titulo">Criar Nova Publicação</h2>
                <button id="btn-fechar-modal" class="btn-fechar-modal">
                    <i class="fas fa-times"></i>
                </button>
            </header>
            <form id="form-postagem">
                <input type="hidden" id="post-id" name="id">
                <div class="form-group">
                    <label for="post-titulo">
                        <i class="fas fa-heading"></i>
                        Título (opcional)
                    </label>
                    <input type="text" id="post-titulo" name="titulo" placeholder="Dê um título à sua publicação...">
                </div>
                <div class="form-group">
                    <label for="post-conteudo">
                        <i class="fas fa-align-left"></i>
                        Conteúdo
                    </label>
                    <textarea id="post-conteudo" name="conteudo" rows="6"
                        placeholder="Compartilhe uma atualização com a comunidade..." required></textarea>
                    <span class="char-counter"><span id="char-count">0</span>/2000</span>
                </div>
                <div class="form-group">
                    <label for="post-imagem">
                        <i class="fas fa-image"></i>
                        Anexar imagem (opcional)
                    </label>
                    <div class="file-input-wrapper">
                        <input type="file" id="post-imagem" name="imagem" accept="image/png, image/jpeg, image/jpg, image/webp">
                        <div id="image-preview" class="image-preview"></div>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="button" id="btn-cancelar" class="btn-secundario">Cancelar</button>
                    <button type="submit" class="btn-publicar">
                        <i class="fas fa-paper-plane"></i>
                        Publicar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div id="modal-confirmar-exclusao" class="modal-overlay" style="display: none;">
        <div class="modal-content modal-confirmar">
            <div class="modal-icon-warning">
                <i class="fas fa-exclamation-triangle"></i>
            </div>
            <h2>Excluir publicação?</h2>
            <p>Esta ação não pode ser desfeita. A publicação será removida permanentemente.</p>
            <div class="form-actions">
                <button type="button" id="btn-cancelar-exclusao" class="btn-secundario">Cancelar</button>
                <button type="button" id="btn-confirmar-exclusao" class="btn-danger">
                    <i class="fas fa-trash"></i>
                    Excluir
                </button>
            </div>
        </div>
    </div>

    <div id="enchant-footer"></div>

</body>

</html>
